<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3D Viewer</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f5f5;
      font-family: "Century Gothic", sans-serif;
      color: #111;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 58px;
      font-weight: normal;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 20px;
      color: #666;
      margin-bottom: 40px;
    }

    .viewer-wrapper {
      width: 100%;
      height: 80vh;
      background: white;
      border-radius: 28px;
      overflow: hidden;
      box-shadow:
        0 10px 40px rgba(0,0,0,0.08),
        0 2px 10px rgba(0,0,0,0.04);
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #fafafa, #ececec);
    }

    .Hotspot {
      background: white;
      border-radius: 999px;
      border: none;
      width: 18px;
      height: 18px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      transition: 0.2s;
      position: relative;
    }

    .Hotspot:hover {
      transform: scale(1.2);
    }

    .HotspotAnnotation {
      position: absolute;
      transform: translate(20px, -50%);
      background: rgba(255,255,255,0.96);
      padding: 12px 16px;
      border-radius: 14px;
      white-space: nowrap;
      font-size: 14px;
      color: #111;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      backdrop-filter: blur(10px);
    }

    .info-section {
      margin-top: 80px;
    }

    h2 {
      font-size: 42px;
      font-weight: normal;
      margin-bottom: 24px;
    }

    .description {
      font-size: 18px;
      line-height: 1.8;
      max-width: 1000px;
      color: #444;
    }

    @media (max-width: 768px) {

      h1 {
        font-size: 42px;
      }

      .viewer-wrapper {
        height: 65vh;
      }

      .HotspotAnnotation {
        font-size: 12px;
        padding: 10px 12px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <h1>3D Viewer</h1>

    <div class="subtitle">
      Интерактивная модель станции с hotspot-метками
    </div>

    <div class="viewer-wrapper">

      <model-viewer
        src="stantion.glb"
        camera-controls
        auto-rotate
        auto-rotate-delay="0"
        rotation-per-second="2deg"
        shadow-intensity="1"
        exposure="1"
        interaction-prompt="none"
        touch-action="pan-y">

        <!-- HOTSPOT 1 -->
        <button class="Hotspot"
          slot="hotspot-1"
          data-position="0m 0.2m 0.3m"
          data-normal="0m 1m 0m">

          <div class="HotspotAnnotation">
            Насос
          </div>

        </button>

        <!-- HOTSPOT 2 -->
        <button class="Hotspot"
          slot="hotspot-2"
          data-position="0.3m 0.1m 0m"
          data-normal="0m 1m 0m">

          <div class="HotspotAnnotation">
            Цилиндр
          </div>

        </button>

        <!-- HOTSPOT 3 -->
        <button class="Hotspot"
          slot="hotspot-3"
          data-position="-0.2m 0.15m 0.1m"
          data-normal="0m 1m 0m">

          <div class="HotspotAnnotation">
            Блок управления
          </div>

        </button>

      </model-viewer>

    </div>

    <div class="info-section">

      <h2>Описание</h2>

      <div class="description">
        Наведите курсор на hotspot-метки для просмотра компонентов установки.
      </div>

    </div>

  </div>

</body>

</html>
